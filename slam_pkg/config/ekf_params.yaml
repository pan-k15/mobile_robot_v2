ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: false   # DiffDrive bridge already publishes odom->base_footprint TF

    # Wheel odometry (bridged from Gazebo DiffDrive plugin)
    odom0: odom
    odom0_config: [true,  true,  false,   # x, y, z
                   false, false, true,    # roll, pitch, yaw
                   true,  false, false,   # vx, vy, vz
                   false, false, true,    # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az
    odom0_differential: false
    odom0_relative: false

    # IMU (bridged from Gazebo IMU plugin)
    imu0: imu
    imu0_config: [false, false, false,   # x, y, z
                  false, false, false,   # roll, pitch, yaw
                  false, false, false,   # vx, vy, vz
                  false, false, true,    # vroll, vpitch, vyaw (angular vel z)
                  true,  false, false]   # ax, ay, az (linear acc x)
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    print_diagnostics: true
